name: Verify TraceBack AI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: traceback
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: traceback_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U traceback -d traceback_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://traceback:ci-only-password@localhost:5432/traceback_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend && ruff format --check backend
      - name: Verify Postgres migrations and Supabase protections
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://traceback:ci-only-password@localhost:5432/traceback_test
        run: python -m alembic upgrade head
      - run: python -m pytest -q
      - run: pip check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test && npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run production browser checks
        env:
          CI: 'true'
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
          SERVE_FRONTEND: 'true'
          CORS_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
        run: |
          python -m alembic upgrade head
          python -m backend.seed
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/traceback-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/health/ready && break; sleep 1; done
          cd frontend
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: traceback-ai:ci
